uid: SR-0012
type: system_requirement
status: approved
title: Separate structure, presentation and behaviour
text: >-
  Strictly keep structure (markup), presentation (styling) and behaviour (scripting)
  apart, linking as few style sheets and scripts as possible from documents.
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: "Google HTML/CSS Style Guide: HTML — Style Rules — Separation of Concerns"
