uid: SR-0010
type: system_requirement
status: approved
title: Use elements for their semantic purpose
text: >-
  Use HTML elements for what they have been created for: use heading, paragraph, list and
  anchor elements according to their purpose, which aids accessibility, reuse and
  efficiency.
