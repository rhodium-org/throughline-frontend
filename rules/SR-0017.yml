uid: SR-0017
type: system_requirement
status: approved
title: Put each block, list or table element on its own line
text: >-
  Use a new line for every block, list or table element, and indent every such child
  element, independent of whether the element's styling has been changed with CSS.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "Google HTML/CSS Style Guide: HTML — Formatting Rules — General Formatting"
