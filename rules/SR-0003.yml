uid: SR-0003
type: system_requirement
status: approved
title: Use only lowercase
text: >-
  Use only lowercase for element names, attributes, attribute values (unless text/CDATA),
  CSS selectors, properties and property values, with the exception of strings.
links:
- target: UR-0002
  type: implements
