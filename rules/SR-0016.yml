uid: SR-0016
type: system_requirement
status: proposed
title: Avoid unnecessary id attributes and hyphenate needed ones
text: Avoid id attributes where a class or other selector suffices, and where an
  id is genuinely needed include a hyphen in its value so it cannot be a JavaScript
  identifier and referenced accidentally.
normative: true
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: 'Google HTML/CSS Style Guide: HTML — Style Rules — id Attributes'
